name: PHP Lint

on:
  push:
    branches: [main, foundation, visit-engine]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Lint PHP files
        shell: bash
        run: |
          set -euo pipefail
          found=0
          while IFS= read -r -d '' file; do
            found=1
            php -l "$file"
          done < <(find . -type f -name '*.php' -not -path './.git/*' -print0)
          if [ "$found" -eq 0 ]; then echo 'No PHP files found.'; fi
