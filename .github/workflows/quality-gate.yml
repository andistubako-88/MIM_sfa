name: MIM SFA Quality Gate

on:
  push:
    branches: [ main, 'audit/**', 'feat/**' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  php-quality:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: mim_sfa_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      MIM_TEST_DB_HOST: 127.0.0.1
      MIM_TEST_DB_NAME: mim_sfa_test
      MIM_TEST_DB_USER: root
      MIM_TEST_DB_PASS: root
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql
          coverage: none

      - name: Wait for MySQL
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..30}; do
            if mysqladmin ping -h 127.0.0.1 -uroot -proot --silent; then exit 0; fi
            sleep 2
          done
          exit 1

      - name: Load all repository SQL into disposable test DB
        shell: bash
        run: |
          set -euo pipefail
          found=0
          while IFS= read -r -d '' sql; do
            found=1
            echo "Loading $sql"
            sed 's/USE mim_sfa;/USE mim_sfa_test;/g; s/CREATE DATABASE IF NOT EXISTS mim_sfa/CREATE DATABASE IF NOT EXISTS mim_sfa_test/g' "$sql" \
              | mysql -h 127.0.0.1 -uroot -proot
          done < <(find database -type f -name '*.sql' -print0 | sort -z)
          if [ "$found" -ne 1 ]; then
            echo 'No SQL schema files found.' >&2
            exit 1
          fi

      - name: Verify required transaction tables
        shell: bash
        run: |
          set -euo pipefail
          tables='users roles sales outlets products visits orders order_items order_status_history stock_locations stock_balances stock_movements order_stock_reservations invoices payments settlements'
          for table in $tables; do
            mysql -N -h 127.0.0.1 -uroot -proot -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='mim_sfa_test' AND table_name='${table}'" | grep -qx '1' || { echo "Missing table: $table"; exit 1; }
          done

      - name: PHP syntax check
        shell: bash
        run: |
          set -euo pipefail
          find api public tests -type f -name '*.php' -print0 | while IFS= read -r -d '' file; do
            php -l "$file"
          done

      - name: Smoke test
        run: php tests/smoke_test.php

      - name: E2E contract test
        run: php tests/e2e_contract_test.php

      - name: MySQL integration preflight
        run: php tests/mysql_integration.php
