name: MIM SFA Quality Gate

on:
  push:
    branches: [ main, 'audit/**', 'feat/**' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  php-quality:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: mim_sfa_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      MIM_TEST_DB_HOST: 127.0.0.1
      MIM_TEST_DB_NAME: mim_sfa_test
      MIM_TEST_DB_USER: root
      MIM_TEST_DB_PASS: root
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql
          coverage: none

      - name: Wait for MySQL
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..30}; do
            if mysqladmin ping -h 127.0.0.1 -uroot -proot --silent; then exit 0; fi
            sleep 2
          done
          exit 1

      - name: Load core schema first
        shell: bash
        run: |
          set -euo pipefail
          sed 's/USE mim_sfa;/USE mim_sfa_test;/g; s/CREATE DATABASE IF NOT EXISTS mim_sfa/CREATE DATABASE IF NOT EXISTS mim_sfa_test/g' database/schema.sql \
            | mysql -h 127.0.0.1 -uroot -proot

      - name: Load dependent schemas in order
        shell: bash
        run: |
          set -euo pipefail
          for sql in \
            database/visit_schema.sql \
            database/attendance_plan_schema.sql \
            database/order_schema.sql \
            database/inventory_schema.sql \
            database/order_stock_reservation.sql \
            database/delivery_return_schema.sql \
            database/finance_schema.sql; do
            echo "Loading $sql"
            sed 's/USE mim_sfa;/USE mim_sfa_test;/g; s/CREATE DATABASE IF NOT EXISTS mim_sfa/CREATE DATABASE IF NOT EXISTS mim_sfa_test/g' "$sql" \
              | mysql -h 127.0.0.1 -uroot -proot
          done

      - name: Load permission and seed SQL
        shell: bash
        run: |
          set -euo pipefail
          for sql in \
            database/seed_rbac.sql \
            database/order_permissions.sql \
            database/order_approval_permissions.sql \
            database/inventory_seed_permissions.sql \
            database/report_permissions.sql \
            database/finance_approval_permissions.sql; do
            echo "Loading $sql"
            sed 's/USE mim_sfa;/USE mim_sfa_test;/g' "$sql" | mysql -h 127.0.0.1 -uroot -proot
          done

      - name: Verify required transaction tables
        shell: bash
        run: |
          set -euo pipefail
          tables='users roles sales outlets products visits plan_calls orders order_items order_status_history stock_locations stock_balances stock_movements order_stock_reservations delivery_documents delivery_items invoices payments settlement_documents'
          for table in $tables; do
            mysql -N -h 127.0.0.1 -uroot -proot -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='mim_sfa_test' AND table_name='${table}'" | grep -qx '1' || { echo "Missing table: $table"; exit 1; }
          done

      - name: PHP syntax check
        shell: bash
        run: |
          set -euo pipefail
          find api public tests -type f -name '*.php' -print0 | while IFS= read -r -d '' file; do
            php -l "$file"
          done

      - name: Smoke test
        run: php tests/smoke_test.php

      - name: E2E contract test
        run: php tests/e2e_contract_test.php

      - name: MySQL integration preflight
        run: php tests/mysql_integration.php
